<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title><%= gameName %></title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #start-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      cursor: pointer;
      user-select: none;
    }
    #start-overlay .title {
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: clamp(18px, 4vw, 36px);
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    #start-overlay .prompt {
      color: rgba(255,255,255,0.5);
      font-family: system-ui, sans-serif;
      font-size: clamp(12px, 2vw, 16px);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1;   }
    }
  </style>
</head>
<body>
  <div id="start-overlay">
    <div class="title"><%= gameName %></div>
    <div class="prompt">Click anywhere to start</div>
  </div>
  <canvas id="game-canvas"></canvas>
  <script>
    (function () {
      var overlay = document.getElementById('start-overlay');
      function start() {
        overlay.style.display = 'none';
        // Resume any suspended AudioContext that was created before the gesture
        if (window._fluxionAudioCtx) {
          window._fluxionAudioCtx.resume().catch(function(){});
        }
        // Resume all Web Audio contexts (covers cases where the engine created it)
        if (typeof AudioContext !== 'undefined') {
          document.querySelectorAll('audio').forEach(function(a) { a.play().catch(function(){}); });
        }
      }
      overlay.addEventListener('click', start, { once: true });
      overlay.addEventListener('keydown', start, { once: true });
    })();
  </script>
</body>
</html>
